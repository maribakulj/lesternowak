[project]
name = "lesternowak"
version = "0.0.1"
description = "Extraction de liaisons œuvre ↔ passage analytique authentique depuis des publications d'histoire de l'art numérisées."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
]

[project.scripts]
lesternowak = "lesternowak.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesternowak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: test qui appelle une source distante réelle (désactivé par défaut, lancer avec -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
