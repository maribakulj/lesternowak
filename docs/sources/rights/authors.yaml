# Statut de domaine public par auteur (lot C1), consultations du 2026-11-17.
# Règle : pd = yes si décès <= 1955 (70 ans révolus au 1er janvier 2026) ;
#         pd = no si décès >= 1956 ; pd = unknown si date introuvable ou identité incertaine.
# Sources : Wikidata (P570, description). IdRef (Sru/Solr) injoignable pendant la session
# (connexion réinitialisée) : aucune date n'est issue d'IdRef. Wikidata a répondu 429 à de
# nombreuses requêtes ; les noms marqués « requête échouée » sont à relancer.
# Personnes morales (collectivités) : la règle par date de décès ne s'applique pas ; pd reste
# unknown et la règle à appliquer (publication, anonymat) est à trancher par le porteur.
# identity_confidence : high = nom + profession + époque concordants ; medium = un seul
# candidat, profession et époque concordants, sans recoupement supplémentaire ; low = aucun
# candidat concordant, ou dates en conflit.

